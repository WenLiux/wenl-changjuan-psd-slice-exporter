[project]
name = "psd-slice-exporter"
version = "0.3.0"
description = "High-fidelity PSD/PSB slice exporter"
requires-python = ">=3.11,<3.15"
dependencies = [
    "customtkinter==6.0.0",
    "Pillow==12.1.1",
    "psd-tools==1.14.2",
    "tkinterdnd2==0.6.2",
    "pywebview==6.1",
]

[project.optional-dependencies]
test = [
    "psutil==7.2.2",
    "pytest==9.1.1",
]
photoshop = [
    "pywin32==311; sys_platform == 'win32'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
